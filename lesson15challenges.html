<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenges</title>
</head>
<body>
    <div class="product-card">
        <img src="markus-spiske-8OyKWQgBsKQ-unsplash.jpg" alt="Shirt" class="product-image">
        <div class="discount-label">20% OFF</div>
        <button class="add-to-cart">Add to Cart</button>
      </div>
    <style>
        .product-card {
        position: relative;
        display: inline-block;
        width: 300px;
        height: 400px;
        border: 1px solid #ccc;
        overflow: hidden;
        }

        .product-image {
        width: 100%;
        height: 99%;
        object-fit: cover;
        }

        .discount-label {
        position: absolute;
        top: 10px;
        right: 10px;
        background: black;
        color: white;
        padding: 5px 10px;
        font-size: 14px;
        }

        .add-to-cart {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: white;
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
        border-radius: 10px;
        }
    </style>
    <div class="product-card">
        <img src="markus-spiske-8OyKWQgBsKQ-unsplash.jpg" alt="Shirt" class="product-image">
        <div class="discount-label">20% OFF</div>
      </div>
</body>
</html>
