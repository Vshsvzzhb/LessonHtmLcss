<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 14f</title>
</head>
<body>
    <div class="sidenav-container">
        <div class=" sidenav-content">
            <img src="markus-spiske-8OyKWQgBsKQ-unsplash.jpg" alt="gambar pertama">
            <img src="markus-spiske-8OyKWQgBsKQ-unsplash.jpg" alt="gambar kedua">
            <img src="markus-spiske-8OyKWQgBsKQ-unsplash.jpg" alt="gambar ketiga">
        </div>

        <div class="side-menu">
            <h3>info</h3>
            <ul>
                <li># new videos</li>
                <li># faq</li>
                <li># updates</li>
            </ul>
        </div>
    </div>
    <style>
        .body {
            margin: 0;
            padding: 0;
            font-family: arial;
        }

        .sidenav-container {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            z-index: 1000;
            display: flex;
        }

        .sidenav-content {
            flex-direction: column;
            width: 100px;
            background-color: #2f3136;
            display: flex;
            align-items: center;
            padding-top: 10px;
        }

        .sidenav-content img {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 10px 0;
        }

        .side-menu {
            background-color: #36393f;
            width: 300px;
            color: white;
            padding: 20px;
            font-family: sans-serif;
        }

        .side-menu h3 {
            margin-top: 0;
            font-size: 50px;
            color: #b9bbbe;
        }

        .side-menu ul {
            list-style: none;
            padding: 0;
        }

        .side-menu li {
            margin: 5px 0;
            color: #dcddde;
            cursor: pointer;
        }
    </style>
