<html lang="en">

<body>
    <div class="container">
        <button class="button-circle1">X</button>
    </div>
    <style>
        .container {
            position: relative;
            width: 300px;
            height: 150px;
            background-color: white;
            margin: 50px 200px 100px;
            
        }

        .button-circle1 {
            position: absolute;
            
            right: 430px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            background-color: black;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
    </style>
        <div class="cihuyahh">
        </div>
        <style>
            .cihuyahh {
            position: fixed;
            align-items: center;
            top: 10%;
            right: 4px;
            width: 320px;
            height: 180px;
            background-color: gray;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            }
        </style>
    </body>
    <div class="fixed-box">
        <button class="button-circle2">X</button>
    </div>
  </body>
  <style>
        .fixed-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 320px;
            height: 180px;
            background-color: gray;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        .button-circle2 {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            top: -20px;
            left: -20px;
            background-color: black;
            color: white;
            cursor: pointer;
        }
  </style>
  <div class="video-container">
    <button class="close-button">X</button>
    <div class="video-placeholder"></div>
    <div class="timestamp">0:29</div>
  </div>
  <style>
    .video-container {
  position: relative;
  width: 300px;
  height: 180px;
  margin: 40px;
  background-color: white;
  border: 1px solid #ccc;
}

.video-placeholder {
  width: 300px;
  height: 184px;
  background: gray;
}

.close-button {
  position: absolute;
  bottom: -20px;
  top: -15px;
  left: -15px;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: black;
  color: white;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.timestamp {
  position: absolute;
  bottom: 8px;
  right: 8px;
  background: black;
  color: white;
  padding: 2px 7px;
  font-size: 12px;
  border-radius: 2px;
}

  </style>
</body>
