<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 14 - Fixed Position Exercises</title>
    <style>
        body {
            height: 3000px;
            margin: 0;
            font-family: Arial, sans-serif;
            padding-right: 100px; 
        }
        
        .fixed-element {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: px;
            height: 50px;
            background-color: #333;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100; 
        }
        
        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: 179px;
            height: 100%;
            justify-content: center;
            align-items: center;
            background-color: #4CAF50;
            color: white;
        }
        
        .sidebar-content {
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-content">
            <b>Right-Sidebar</b>
        </div>
    </div>
    <div class="fixed-element">
        Button Black
    </div>
</body>
</html>
