<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header class="header">
        <div class="profile">
            <img src="markus-spiske-8OyKWQgBsKQ-unsplash.jpg" alt="Profile">
            <span>Oliver Cat</span>
        </div>
        <div class="buttons">
            <button class="add-friend">Add Friend</button>
            <button class="message">Message</button>
        </div>
    </header>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }
    
    body {
        display: flex;
    }
    
    .header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: white;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0px -18px 50px 15px rgba(0,0,0,0.1);
    }
    
    .profile {
        display: flex;
        align-items: center;
        text-align-last: auto;
    }
    
    .profile img {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin-right: 20px;
    }
    
    .buttons button {
        margin-left: 30px;
        padding: 10px 10px;
        cursor: pointer;
    }
    
    .add-friend {
        background: rgb(69, 148, 175);
        color: white;
        border-radius: 5px;
        border: none;
    }
    
    .message {
        background: lightgray;
        border: none;
        border-radius: 5px;
        color: gray;
    }
</style>
</body>
</html>
