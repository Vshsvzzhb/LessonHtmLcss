<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 14d - Modal (CSS Only)</title>
    <style>

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            width: 300px;
            text-align: center;
        }

        .close-button {
            background-color: #f0f0f0;
            border: 1px solid #ccc;
            padding: 5px 15px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 15px;
        }

        
        #modal-toggle {
            display: none;
        }

        #modal-toggle:checked ~ .modal-overlay {
            display: flex;
        }

        .open-modal {
            width: 200px;
            height: 1000px;
            display: flex;
            padding: 8px ;
            background-color: lightgreen;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <input type="checkbox" id="modal-toggle">
    <label for="modal-toggle" class="open-modal">Open Modal</label>
    <div class="modal-overlay">
        <div class="modal-container">
            <h2>Modal Title</h2>
            <p>This is a modal</p>
            <label for="modal-toggle" class="close-button">Close</label>
        </div>
    </div>
</body>
</html>
